# Test the ladder engine on Linux, with no board (see sim/build.py):
#   - the PC tests, under AddressSanitizer and UBSan;
#   - two minutes of fuzzing the assembler with libFuzzer;
#   - the WebAssembly engine the simulator runs: rebuilt from the source, it must
#     match viewer/c3uview/web/plc.wasm byte for byte, and pass sim/test_wasm.js.

name: Ladder engine tests

on:
  push:
    branches: [main]
    paths: &paths
      - app/plc*
      - drivers/gpio.c
      - drivers/gpio.h
      - sim/**
      - examples/ladder/**
      - viewer/c3uview/web/plc.wasm
      - .github/workflows/ladder-tests.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  WASI_SDK_VERSION: "34"
  WASI_SDK: wasi-sdk-34.0-x86_64-linux

jobs:
  tests:
    name: PC tests, sanitized
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 sim/build.py test --sanitize

  fuzz:
    name: Fuzz the assembler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang and libFuzzer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
      - run: CC=clang python3 sim/build.py fuzz 120
      - name: Keep the input that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure
          path: sim/out/crash-*

  wasm:
    name: WebAssembly engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Restore the WASI SDK
        id: sdk
        uses: actions/cache@v6
        with:
          path: ~/${{ env.WASI_SDK }}
          key: ${{ env.WASI_SDK }}

      - name: Download the WASI SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK_VERSION/$WASI_SDK.tar.gz" \
            | tar -xz -C "$HOME"

      - name: Build it again, and compare
        run: |
          WASI_SDK_PATH="$HOME/$WASI_SDK" python3 sim/build.py wasm
          if ! git diff --quiet viewer/c3uview/web/plc.wasm; then
            echo "viewer/c3uview/web/plc.wasm is out of date: run python sim/build.py wasm and commit it" >&2
            git show HEAD:viewer/c3uview/web/plc.wasm > committed.wasm
            echo "bytes that differ: $(cmp -l committed.wasm viewer/c3uview/web/plc.wasm | wc -l)"
            cmp -l committed.wasm viewer/c3uview/web/plc.wasm | head -20
            echo "wasm-opt: $(command -v wasm-opt || echo none)"
            exit 1
          fi

      - name: Keep the build that differed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plc-wasm-built-here
          path: viewer/c3uview/web/plc.wasm

      - run: node sim/test_wasm.js
