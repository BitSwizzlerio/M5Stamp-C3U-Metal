# Build C3U Viewer for Windows and Linux, and publish them as a GitHub Release.
#
#   git tag viewer-v0.1.0 && git push origin viewer-v0.1.0
#
# The tag's version must match __version__ in viewer/c3uview/__init__.py. To build
# without publishing, use "Run workflow" on the Actions page: the programs are then
# kept as downloadable artifacts of that run.
#
# The viewer carries C3U-Metal's firmware, so that is built first, on Linux, with
# Espressif's RISC-V toolchain. Each program has to be built on its own system.

name: C3U Viewer release

on:
  push:
    tags: ["viewer-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TOOLCHAIN_VERSION: esp-15.2.0_20251204
  TOOLCHAIN_FILE: riscv32-esp-elf-15.2.0_20251204-x86_64-linux-gnu.tar.xz

jobs:
  firmware:
    name: C3U-Metal firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the RISC-V toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/riscv32-esp-elf
          key: ${{ env.TOOLCHAIN_FILE }}

      - name: Download the RISC-V toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/espressif/crosstool-NG/releases/download/$TOOLCHAIN_VERSION/$TOOLCHAIN_FILE" \
            | tar -xJ -C "$HOME"

      - name: Build
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build
          export PATH="$HOME/riscv32-esp-elf/bin:$PATH"
          cmake --preset default
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/c3u-metal.bin
          if-no-files-found: error

  viewer:
    name: Viewer for ${{ matrix.system }}
    needs: firmware
    strategy:
      matrix:
        include:
          - system: Windows
            runner: windows-latest
            built: viewer/dist/c3u-viewer.exe
            asset: c3u-viewer-windows-x64.exe
          - system: Linux
            runner: ubuntu-22.04          # the oldest Linux the program then runs on
            built: viewer/dist/c3u-viewer
            asset: c3u-viewer-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: bash
        run: |
          python -m pip install -r viewer/requirements.txt pyinstaller
          python viewer/build.py
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"
          cp -r viewer/dist/licenses out/licenses

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out
          if-no-files-found: error

  release:
    name: Publish the release
    needs: viewer
    if: startsWith(github.ref, 'refs/tags/viewer-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check the version and gather the files
        run: |
          tag="${GITHUB_REF_NAME#viewer-v}"
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('viewer/c3uview/__init__.py').read()).group(1))")
          if [ "$tag" != "$version" ]; then
            echo "The tag says $tag but viewer/c3uview/__init__.py says $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir release
          cp artifacts/c3u-viewer-windows-x64.exe/c3u-viewer-windows-x64.exe release/
          cp artifacts/c3u-viewer-linux-x64/c3u-viewer-linux-x64 release/
          chmod +x release/c3u-viewer-linux-x64
          (cd artifacts/c3u-viewer-linux-x64 && zip -qr ../../release/c3u-viewer-licenses.zip licenses)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          C3U Viewer $VERSION: watch an M5Stamp C3U's pins and talk to its Lua, in a browser, over the USB cable.

          **Windows:** download \`c3u-viewer-windows-x64.exe\` and double-click it. If SmartScreen says it "protected your PC", choose **More info**, then **Run anyway**. The first time on a computer, click **Install the driver** in the yellow banner and answer **Yes**.

          **Linux** (Ubuntu 22.04, Debian 12 or newer, 64-bit): download \`c3u-viewer-linux-x64\`, then \`chmod +x c3u-viewer-linux-x64\` and \`./c3u-viewer-linux-x64\`. The first time, run the command the yellow banner shows, then replug the board.

          Both programs carry C3U-Metal's firmware, so **Flash…** can put it back on a board. \`c3u-viewer-licenses.zip\` has the licences of everything they include, and where to get the source of OpenOCD.

          More: [viewer/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/viewer/README.md)
          EOF
          gh release create "$GITHUB_REF_NAME" release/* --title "C3U Viewer $VERSION" --notes-file notes.md
